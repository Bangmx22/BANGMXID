<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — BANGMX STORE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">BANGMX <span class="logo-sub">ADMIN</span></a>
            <div class="nav-links">
                <a href="/">Kembali ke Toko</a>
                <button class="btn btn-outline btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>
    <div class="container admin-container" style="display:none" id="admin-main">
        <h1>Admin Dashboard</h1>
        <p class="text-muted">Kelola order yang masuk.</p>
        <div class="admin-section">
            <h2>Daftar Order</h2>
            <div class="order-list" id="order-list"></div>
        </div>
    </div>
    <div class="container admin-container" id="admin-auth-banner" style="display:none">
        <div class="alert alert-warning">
            <strong>⚠️ Anda tidak login.</strong> Silakan login terlebih dahulu.
        </div>
        <a href="/auth.html" class="btn btn-primary">Login / Daftar</a>
    </div>
    <div id="toast-container"></div>
    <script src="app.js"></script>
    <script>
    // ===== ADMIN PANEL LOGIC =====
    
    document.addEventListener('DOMContentLoaded', () => {
        // Cek apakah admin sudah login (simpan di localStorage)
        const isLoggedIn = localStorage.getItem('bangmx_admin_loggedin') === 'true';
        if (isLoggedIn) {
            document.getElementById('admin-auth-banner').style.display = 'none';
            document.getElementById('admin-main').style.display = 'block';
            loadOrdersAdmin();
        } else {
            document.getElementById('admin-main').style.display = 'none';
            document.getElementById('admin-auth-banner').style.display = 'block';
            showToast('Silakan login untuk mengakses admin.', 'warning');
            // Auto redirect ke halaman login setelah 2 detik
            setTimeout(() => {
                if (localStorage.getItem('bangmx_admin_loggedin') !== 'true') {
                    window.location.href = '/auth.html';
                }
            }, 2000);
        }
    });

    async function loadOrdersAdmin() {
        try {
            const res = await fetch('/api/orders');
            if (!res.ok) throw new Error('API tidak tersedia');
            const orders = await res.json();
            renderOrders(orders);
        } catch (err) {
            // Fallback: coba ambil dari localStorage (kalau ada)
            const stored = localStorage.getItem('bangmx_order_history') || '[]';
            const orders = JSON.parse(stored);
            if (orders.length) {
                renderOrders(orders);
            } else {
                showToast('Gagal connect ke server. Gunakan mode demo.', 'warning');
                document.getElementById('order-list').innerHTML = 
                    '<p class="text-muted">Belum ada order atau server tidak tersedia.</p>';
            }
        }
    }

    function renderOrders(orders) {
        const container = document.getElementById('order-list');
        container.innerHTML = '';
        if (!orders.length) {
            container.innerHTML = '<p class="text-muted">Belum ada order.</p>';
            return;
        }
        orders.forEach(order => {
            const card = document.createElement('div');
            card.className = 'order-card';
            const statusClass = 'status-' + (order.status || 'pending').toLowerCase();
            card.innerHTML = `
                <div class="order-header">
                    <span class="order-id">#${order.id.slice(0,8)}</span>
                    <span class="status-badge ${statusClass}">${(order.status || 'pending').toUpperCase()}</span>
                </div>
                <div class="order-body">
                    <p><strong>Produk:</strong> ${order.productName} (${order.game})</p>
                    <p><strong>Harga:</strong> Rp ${order.price.toLocaleString('id-ID')}</p>
                    <p><strong>Player ID:</strong> ${order.playerId}</p>
                    <p><strong>Pembeli:</strong> ${order.customerInfo?.fullname || '-'}</p>
                    <p><strong>Contact:</strong> ${order.customerInfo?.contact || '-'}</p>
                    <p><strong>Waktu:</strong> ${order.createdAt ? new Date(order.createdAt).toLocaleString('id-ID') : '-'}</p>
                    ${order.paymentProof ? `<p class="payment-proof"><strong>Bukti:</strong> ${order.paymentProof}</p>` : ''}
                    ${order.notes ? `<p class="order-notes"><strong>Catatan:</strong> ${order.notes}</p>` : ''}
                </div>
                <div class="order-actions">
                    <button class="btn btn-sm btn-outline" onclick="confirmPayment('${order.id}')" ${order.status==='paid'?'disabled':''}>✅ Konfirmasi Bayar</button>
                    <button class="btn btn-sm btn-outline" onclick="deliverOrder('${order.id}')" ${order.status!=='paid'?'disabled':''}>📦 Kirim</button>
                    <button class="btn btn-sm btn-danger" onclick="cancelOrder('${order.id}')" ${order.status==='delivered'?'disabled':''}>❌ Batal</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function confirmPayment(orderId) {
        const proof = prompt('Bukti pembayaran (nomor transaksi / keterangan):');
        if (!proof) return;
        try {
            const res = await fetch(`/api/orders/${orderId}/status`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({status:'paid', paymentProof: proof})
            });
            if (!res.ok) throw new Error('Gagal');
            showToast('Pembayaran dikonfirmasi!', 'success');
            // Simpan ke localStorage juga
            saveOrderToLocalStorage({ id: orderId, status: 'paid', paymentProof: proof });
            loadOrdersAdmin();
        } catch (err) {
            // Fallback localStorage
            saveOrderToLocalStorage({ id: orderId, status: 'paid', paymentProof: proof });
            showToast('Pembayaran dikonfirmasi (mode demo)!', 'success');
            loadOrdersAdmin();
        }
    }

    async function deliverOrder(orderId) {
        const notes = prompt('Catatan pengiriman (misal: kode UC/Diamond):', '') || 'Tanpa catatan';
        try {
            await fetch(`/api/orders/${orderId}/notes`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({notes: notes})
            });
            const res = await fetch(`/api/orders/${orderId}/status`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({status:'delivered'})
            });
            if (!res.ok) throw new Error('Gagal');
            showToast('Order dikirim!', 'success');
            saveOrderToLocalStorage({ id: orderId, status: 'delivered', notes: notes });
            loadOrdersAdmin();
        } catch (err) {
            saveOrderToLocalStorage({ id: orderId, status: 'delivered', notes: notes });
            showToast('Order dikirim (mode demo)!', 'success');
            loadOrdersAdmin();
        }
    }

    async function cancelOrder(orderId) {
        if (!confirm('Yakin ingin membatalkan order ini?')) return;
        try {
            const res = await fetch(`/api/orders/${orderId}/status`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({status:'failed'})
            });
            if (!res.ok) throw new Error('Gagal');
            showToast('Order dibatalkan', 'warning');
            saveOrderToLocalStorage({ id: orderId, status: 'failed' });
            loadOrdersAdmin();
        } catch (err) {
            saveOrderToLocalStorage({ id: orderId, status: 'failed' });
            showToast('Order dibatalkan (mode demo)', 'warning');
            loadOrdersAdmin();
        }
    }

    function saveOrderToLocalStorage(update) {
        const stored = localStorage.getItem('bangmx_order_history') || '[]';
        const orders = JSON.parse(stored);
        const idx = orders.findIndex(o => o.id === update.id);
        if (idx >= 0) {
            orders[idx] = { ...orders[idx], ...update };
        } else {
            orders.push(update);
        }
        localStorage.setItem('bangmx_order_history', JSON.stringify(orders));
    }

    function logout() {
        localStorage.removeItem('bangmx_admin_loggedin');
        localStorage.removeItem('bangmx_admin_username');
        window.location.href = '/auth.html';
    }
    </script>
</body>
</html>
